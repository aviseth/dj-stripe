# Config for Dependabot updates. See Documentation here:
# https://docs.github.com/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/configuration-options-for-dependency-updates

version: 2
updates:
  # Update Github actions in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      # Prefix all commit messages with "[actions] " (no colon, but a trailing whitespace)
      prefix: "[actions] "
    # Labels on pull requests for version updates only
    labels:
      - "update"
      - "action dependencies"

  # Update pre-commit hooks. Without this the hook revs rot in place while the
  # matching pip dependencies move, which is how ruff drifted out of lockstep.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      # Prefix all commit messages with "[pre-commit] " (no colon, but a trailing whitespace)
      prefix: "[pre-commit] "
    # Labels on pull requests for version updates only
    labels:
      - "update"
      - "pip dependencies"

  # Update python packages
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      # Prefix all commit messages with "[python] " (no colon, but a trailing whitespace)
      prefix: "[python] "
    # Labels on pull requests for version updates only
    labels:
      - "update"
      - "pip dependencies"
