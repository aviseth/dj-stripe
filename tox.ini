# The test matrix lives here rather than in pyproject.toml because tox's native
# TOML configuration does not support generative environments: brace expansion
# and factor-conditional settings are only honoured in INI format.
[tox]
envlist =
    django{52,60,61}-py{312,313}-{postgres,sqlite}
    django52-py311-{postgres,sqlite}
    django{60,61}-py314-{postgres,sqlite}
    djangomain-py314-postgres
skip_missing_interpreters = true

# tox-gh replaces envlist wholesale with the entry matching the runner's Python,
# so each key lists the full set of environments valid for that interpreter.
[gh]
python =
    3.11 = django52-py311-{postgres,sqlite}
    3.12 = django{52,60,61}-py312-{postgres,sqlite}
    3.13 = django{52,60,61}-py313-{postgres,sqlite}
    3.14 = django{60,61}-py314-{postgres,sqlite}, djangomain-py314-postgres

[testenv]
passenv = DJSTRIPE_*
commands = pytest {posargs}
deps =
    pytest-django
    pytest-cov
    pytest-dotenv
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    djangomain: https://github.com/django/django/archive/main.tar.gz
    postgres: psycopg>=3.3.4
setenv =
    postgres: DJSTRIPE_TEST_DB_VENDOR=postgres
    sqlite: DJSTRIPE_TEST_DB_VENDOR=sqlite
